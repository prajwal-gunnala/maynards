<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshAI</title>
<style>
  :root {
    --bg:#09090b; --card:#111113; --raised:#18181b; --line:#26262a; --line-soft:#1c1c20;
    --fg:#ededed; --fg-2:#8b8b93; --fg-3:#63636b;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --helper:#a78bfa; --info:#60a5fa;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Noto Sans", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.5 var(--sans); }
  button, input, textarea { font:inherit; color:inherit; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .muted { color:var(--fg-2); } .faint { color:var(--fg-3); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .helper { color:var(--helper); }

  .app { display:grid; grid-template-columns:minmax(0,1fr) 420px; height:100vh; }
  .left { overflow:auto; }
  .right { overflow:auto; background:var(--card); border-left:1px solid var(--line); }
  .wrap { padding:24px 28px 40px; max-width:1180px; }

  /* ---------- shared */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:6px 12px; border-radius:7px;
         border:1px solid var(--line); background:var(--raised); cursor:pointer; white-space:nowrap; font-size:13px; }
  .btn:hover { border-color:#3a3a40; } .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn.primary { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
  .btn.ghost { background:none; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border:1px solid var(--line); border-radius:999px;
          font:12px var(--mono); color:var(--fg-2); background:var(--bg); white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--fg-3); flex:none; display:inline-block; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
  .dot.live { background:var(--ok); box-shadow:0 0 0 3px #4ade8026; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px #4ade8000; } }
  .label { font:500 11px var(--mono); color:var(--fg-3); letter-spacing:.8px; text-transform:uppercase; }
  .sec { margin-top:28px; }
  .sechead { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .sechead .grow { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .rules { display:flex; flex-wrap:wrap; gap:6px; }
  .rule { display:inline-flex; gap:6px; align-items:baseline; padding:5px 9px; border:1px solid var(--line-soft);
          border-radius:6px; background:var(--card); font-size:12px; color:var(--fg-2); }
  .rule b { font:600 10.5px var(--mono); color:var(--fg-3); letter-spacing:.5px; }
  .locked { opacity:.35; pointer-events:none; filter:grayscale(1); }
  .progress { height:3px; background:var(--line); border-radius:3px; overflow:hidden; }
  .progress i { display:block; height:100%; width:30%; background:var(--ok); animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left:-30%; } 100% { margin-left:100%; } }

  /* ---------- left: header and steps */
  .top { display:flex; align-items:center; gap:12px; }
  .logo { width:28px; height:28px; border-radius:7px; border:1px solid var(--line); display:grid; place-items:center; color:var(--ok); font:600 12px var(--mono); }
  .top h1 { font-size:18px; margin:0; font-weight:600; }
  .top .grow { flex:1; }
  .stepper { display:flex; gap:6px; margin-top:18px; flex-wrap:wrap; }
  .st { display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border:1px solid var(--line); border-radius:999px; font-size:13px; color:var(--fg-2); }
  .st i { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font:600 11px var(--mono); font-style:normal; border:1px solid var(--line); }
  .st.done { color:var(--fg); } .st.done i { color:var(--ok); border-color:#4ade8055; }
  .st.now { color:var(--fg); border-color:var(--fg-2); } .st.now i { border-color:var(--fg); color:var(--fg); }
  .st.later { opacity:.45; }
  .hint { margin-top:10px; font-size:13px; color:var(--fg-2); }
  .hint b { color:var(--fg); font-weight:600; }

  /* ---------- tiles */
  .tiles { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px; }
  .tile { padding:12px 14px; }
  .tile .k { font-size:12px; color:var(--fg-2); }
  .tile .v { font:600 22px var(--mono); margin-top:2px; }
  .tile .s { font:11.5px var(--mono); color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- split + map */
  .split { padding:16px 18px; }
  .bar { display:flex; height:28px; border-radius:7px; overflow:hidden; border:1px solid var(--line); }
  .bar div { display:grid; place-items:center; font:12px var(--mono); color:var(--bg); min-width:26px; border-right:1px solid var(--bg); }
  .bar .h { background:var(--ok); } .bar .p { background:var(--helper); } .bar div:last-child { border-right:0; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px; font:12.5px var(--mono); color:var(--fg-2); }
  .legend b { color:var(--fg); font-weight:500; }
  .sq { width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
  .map svg { width:100%; height:300px; display:block; }

  /* ---------- device cards */
  .devs { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:12px; }
  .dev { padding:16px 18px; }
  .dev.stale { opacity:.55; }
  .dev .h { display:flex; align-items:center; gap:10px; }
  .dev .h .n { flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dev .sub { font:12px var(--mono); color:var(--fg-2); margin:2px 0 12px; }
  .meter { margin:8px 0; }
  .meter .t { display:flex; justify-content:space-between; font-size:12.5px; color:var(--fg-2); }
  .meter .t span:last-child { font-family:var(--mono); color:var(--fg); }
  .meter .b { height:6px; background:var(--raised); border-radius:4px; overflow:hidden; margin-top:4px; border:1px solid var(--line-soft); }
  .meter .b i { display:block; height:100%; border-radius:4px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.5px; margin-top:10px; }
  .kv span:nth-child(odd) { color:var(--fg-3); }
  .kv span:nth-child(even) { font-family:var(--mono); text-align:right; }
  .pair { display:flex; gap:20px; align-items:center; padding:16px 18px; }
  .qr { background:#fff; border-radius:10px; padding:10px; width:180px; height:180px; flex:none; }
  .qr svg { width:100%; height:100%; display:block; }
  .pair ol { margin:0; padding-left:18px; color:var(--fg-2); } .pair li { margin:4px 0; }
  .feed { padding:12px 16px; font:12px/1.7 var(--mono); color:var(--fg-2); max-height:260px; overflow:auto; }
  .feed .ok { color:var(--ok); } .feed .bad { color:var(--bad); }

  /* ---------- right: model and agent */
  .panel { padding:20px 22px; border-bottom:1px solid var(--line); }
  .panel h2 { font-size:14px; margin:0; font-weight:600; }
  .panel .sechead { margin-bottom:12px; }
  .opt { display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; cursor:pointer; background:var(--bg); }
  .opt:hover { border-color:#3a3a40; } .opt.sel { border-color:var(--fg-2); }
  .opt .t { flex:1; min-width:0; } .opt .t small { display:block; font:11.5px var(--mono); color:var(--fg-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .runline { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .runline .t { flex:1; min-width:0; font-size:12.5px; } .runline .t small { display:block; font:11.5px var(--mono); color:var(--fg-2); }
  .perm { display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line-soft); }
  .perm:first-of-type { border-top:0; }
  .perm .t { flex:1; } .perm .t small { display:block; font-size:12px; color:var(--fg-2); }
  .sw { width:34px; height:20px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex:none; border:0; padding:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--fg-2); transition:left .15s; }
  .sw.on { background:#4ade8055; } .sw.on::after { left:17px; background:var(--ok); }
  .sw.danger.on { background:#f8717155; } .sw.danger.on::after { background:var(--bad); }
  .field { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .field input { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:6px 10px; font:12.5px var(--mono); }
  textarea.ask { width:100%; margin-top:12px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; resize:vertical; min-height:74px; outline:0; }
  textarea.ask:focus { border-color:#3a3a40; }
  .sendrow { display:flex; align-items:center; gap:8px; margin-top:8px; } .sendrow .grow { flex:1; font:12px var(--mono); color:var(--fg-3); }
  .task { margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .task .ttl { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task .line { display:flex; gap:8px; align-items:center; font:12px var(--mono); color:var(--fg-2); margin-top:6px; flex-wrap:wrap; }
  pre { margin:8px 0 0; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px;
        font:11.5px/1.5 var(--mono); color:#c9c9d1; white-space:pre-wrap; word-break:break-word; max-height:200px; overflow:auto; }
  details summary { cursor:pointer; font:12px var(--mono); color:var(--fg-2); margin-top:8px; }
  .recent button { display:flex; width:100%; gap:8px; align-items:center; padding:6px 0; background:none; border:0; cursor:pointer; color:var(--fg-2); text-align:left; font-size:12.5px; }
  .recent button:hover { color:var(--fg); } .recent .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .modal { position:fixed; inset:0; background:#000a; display:none; place-items:center; z-index:9; }
  .modal.on { display:grid; }
  .modal .card { width:min(900px, 90vw); max-height:84vh; display:flex; flex-direction:column; }
  .modal .mh { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); gap:10px; }
  .diff { overflow:auto; padding:10px 0; font:12px/1.5 var(--mono); }
  .diff div { padding:0 16px; white-space:pre-wrap; word-break:break-all; }
  .diff .a { background:#4ade8014; color:#86efac; } .diff .d { background:#f8717114; color:#fca5a5; } .diff .x { color:var(--info); }
  .banner { display:none; padding:8px 28px; background:#2a2210; color:var(--warn); font:12px var(--mono); }
  .banner.on { display:block; }
  @media (max-width: 1300px) { .tiles { grid-template-columns:repeat(3, minmax(0,1fr)); } .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <div class="left"><div class="banner" id="banner">Reconnecting…</div><div class="wrap" id="cluster"></div></div>
  <div class="right" id="side"></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeDiff()"><div class="card"><div class="mh"><b class="mono" id="mtitle"></b><span style="flex:1"></span><button class="btn ghost" onclick="closeDiff()">Close</button></div><div class="diff" id="mdiff"></div></div></div>

<script>
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const CTX_FOR_AIDER = 16384;
const PERMS = [
  ['edit',   'Edit files',     'Write its changes into the project'],
  ['commit', 'Commit changes', 'Each change becomes a git commit you can undo'],
  ['tests',  'Run tests',      'After each edit; failures go back to the model'],
  ['shell',  'Shell commands', 'Runs any command it suggests, without asking'],
];
let mesh = null, projects = [], tasks = [], current = null, events = [], nextEv = 0, pairing = false, busy = false, note = '';
const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const load = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
let chosen = { model: load('model', ''), project: load('project', ''), laptopOnly: load('laptopOnly', '') === '1' };
let perms = (() => { try { return { edit: true, commit: true, tests: true, shell: false, ...JSON.parse(load('perms', '{}')) }; } catch (e) { return { edit: true, commit: true, tests: true, shell: false }; } })();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gb = n => (n ?? 0).toFixed(1);
const dur = s => s == null ? '' : s < 60 ? Math.round(s) + ' s' : Math.floor(s / 60) + ' min ' + Math.round(s % 60) + ' s';
const rule = (tag, text) => `<span class="rule"><b>${tag}</b>${text}</span>`;
const pct = (a, b) => Math.max(0, Math.min(100, b ? a / b * 100 : 0));

async function svc(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'X-Mesh-Token': TOKEN, 'Content-Type': 'application/json' },
                                body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function native(msg) { try { window.webkit.messageHandlers.mesh.postMessage(JSON.stringify(msg)); return true; } catch (e) { return false; } }

// ---------------------------------------------------------------- the five setup steps
function steps() {
  const m = mesh || {}, run = m.run || {}, peers = m.peers || [];
  const model = (m.models || []).find(x => x.file === chosen.model);
  return [
    { k:'Host',    ok: !!mesh && !mesh.offline && (m.ctx || 0) >= CTX_FOR_AIDER,
      hint: !mesh || mesh.offline ? 'Starting the host on this laptop…' : `Restart the host with <b>MESH_CTX=${CTX_FOR_AIDER}</b> so the agent's prompts fit.` },
    { k:'Phones',  ok: peers.length > 0 || chosen.laptopOnly,
      hint: 'Plug in a phone, turn on <b>USB tethering</b>, then <b>Pair a phone</b> below.' },
    { k:'Model',   ok: !!model && model.plan?.verdict !== 'not_possible', hint: 'Pick a model on the right.' },
    { k:'Run',     ok: !!model && run.status === 'ready' && run.model === model.name, hint: 'Press <b>Run</b> on the right. About 70 s.' },
    { k:'Project', ok: !!projects.find(p => p.path === chosen.project), hint: 'Choose a git repo for the agent on the right.' },
  ];
}
const stepOk = k => steps().find(s => s.k === k).ok;

// ---------------------------------------------------------------- left: the cluster, in detail
function renderCluster() {
  const m = mesh || {}, run = m.run || {}, peers = m.peers || [];
  const slices = (run.plan || {}).slices || [];
  const chosenModel = (m.models || []).find(x => x.file === chosen.model);
  const plan = slices.length ? run.plan : (chosenModel?.plan || {});
  const shown = plan.slices || [];
  const chats = m.chats || [], last = chats.slice().reverse().find(c => c.tps) || {};
  const st = steps(); let seen = false;
  const worst = Math.max(0, ...peers.map(p => p.rtt_worst_ms || 0));
  const layersTotal = shown.reduce((a, x) => a + (x.to - x.from), 0);
  const next = st.find(s => !s.ok);

  let h = `<div class="top"><div class="logo">M</div><h1>Cluster</h1>
      <span class="chip"><span class="dot ${run.status === 'ready' ? 'ok' : run.status === 'loading' || run.status === 'starting' ? 'live' : 'warn'}"></span>${esc(run.model || 'no model')} · ${esc(run.status || 'idle')}</span>
      ${(m.pinned || {}).model ? '<span class="chip ok">📌 pinned</span>' : ''}<span class="grow"></span>
      <button class="btn" onclick="pairing=!pairing;render()">${pairing ? 'Hide code' : 'Pair a phone'}</button>
      <button class="btn ghost" onclick="native({kind:'dashboard'})">Dashboard</button></div>
    <div class="stepper">${st.map((s, i) => { let c = s.ok ? 'done' : 'now'; if (!s.ok) { if (seen) c = 'later'; seen = true; }
      return `<div class="st ${c}"><i>${s.ok ? '✓' : i + 1}</i>${s.k}</div>`; }).join('')}</div>
    ${next ? `<div class="hint">Next: ${next.hint}</div>` : '<div class="hint ok">Ready: the agent on the right can work.</div>'}`;

  if (pairing || (!peers.length && !chosen.laptopOnly && mesh && !mesh.offline)) {
    h += `<div class="sec card pair"><div class="qr">${m.qr || ''}</div><div><div class="label" style="margin-bottom:8px">Pair a phone</div><ol>
      <li>Plug the phone into this laptop, turn on <b>USB tethering</b></li><li>Open MeshAI → <b>Helper</b> → <b>Scan to join</b></li><li>Scan this code. It joins over the cable.</li></ol>
      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn ghost" onclick="svc('/svc/newqr',{}).then(poll)">New code</button>
      ${!peers.length ? `<button class="btn ghost" onclick="chosen.laptopOnly=true;store('laptopOnly','1');render()">Laptop only</button>` : ''}</div></div></div>`;
  }

  h += `<div class="sec tiles">
    ${tile('Devices', peers.length + 1, `${peers.filter(p => p.link === 'USB cable').length} on USB`)}
    ${tile('Pooled', gb(m.pool_gb), 'GB free for models')}
    ${tile('Layers', layersTotal || '—', shown.length ? `on ${shown.length} devices` : 'no split')}
    ${tile('Speed', last.tps ? last.tps.toFixed(1) : '—', m.stats?.best_tps ? `tok/s, best ${m.stats.best_tps.toFixed(1)}` : 'tok/s')}
    ${tile('First word', last.first_ms ? (last.first_ms / 1000).toFixed(1) : '—', 'seconds')}
    ${tile('Link', peers.length ? Math.round(worst) : '—', 'ms at worst')}</div>`;

  h += `<div class="sec grid2"><div class="card split"><div class="sechead"><span class="label">Layer split</span><span class="grow"></span>
      ${shown.length ? `<span class="chip">${esc(plan.reason || '')}</span>` : ''}</div>
      ${shown.length ? `<div class="bar">${shown.map(x => `<div class="${x.host ? 'h' : 'p'}" style="flex:${Math.max(1, x.to - x.from)}">${x.to - x.from}</div>`).join('')}</div>
      <div class="legend">${shown.map(x => `<span><i class="sq" style="background:${x.host ? 'var(--ok)' : 'var(--helper)'}"></i><b>${esc(short(x.name))}</b> ${x.from}–${x.to - 1} · ${gb(x.gb)} GB</span>`).join('')}</div>`
        : '<div class="muted" style="font-size:13px">Pick a model on the right to see how it is split.</div>'}
      <div class="rules" style="margin-top:14px">${rule('PLAN','Phones fill first, the laptop keeps the rest')}${rule('HOST','Embeddings and output stay on the laptop')}${rule('FIT','Never split what fits on one device')}</div></div>
    <div class="card map">${meshMap(m, slices)}</div></div>`;

  h += `<div class="sec"><div class="sechead"><span class="label">Devices</span></div><div class="devs">
      ${devCard(true, { id: 'laptop', name: m.laptop?.specs?.name || 'This laptop', specs: m.laptop?.specs || {}, usable_gb: m.laptop?.usable_gb }, slices, run)}
      ${peers.map(p => devCard(false, p, slices, run)).join('')}</div></div>`;

  h += `<div class="sec grid2"><div class="card"><div class="sechead" style="padding:14px 16px 0"><span class="label">Activity</span></div>
      <div class="feed">${(m.activity || []).slice(0, 30).map(a => `<div class="${/^✓/.test(a.line) ? 'ok' : /^(✗|failed|refused)/.test(a.line) ? 'bad' : ''}">${esc(a.t)}  ${esc(a.line)}</div>`).join('') || 'Nothing yet'}</div></div>
    <div class="card" style="padding:14px 16px"><div class="sechead"><span class="label">Rules in use</span></div><div class="rules">
      ${rule('LINK','USB cable: 2–3 ms. Wi-Fi: 20–400 ms')}${rule('SKIP','A phone over 60 ms is left out')}${rule('SKIP','Battery under 20% and not charging')}
      ${rule('KEEP','15% of RAM stays free')}${rule('STORE','Phones keep their layers: only a fingerprint crosses')}${rule('PIN','Pinned: same layers, starts when all join')}
      ${rule('HEAT','Hot phones still run; they slow down')}${rule('ONE','One request at a time')}${rule('CTX',`Context ${m.ctx || '—'} tokens, KV cache 8-bit`)}</div></div></div>`;
  $('cluster').innerHTML = h;
}
const short = n => String(n || '').replace(' (this laptop)', '');
const chipName = c => String(c || '').replace(/Intel\(R\) Core\(TM\) /, '').replace(/ CPU @.*/, '').replace(/\(R\)|\(TM\)/g, '');
const tile = (k, v, s) => `<div class="card tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

function devCard(isHost, d, slices, run) {
  const s = d.specs || {}, sl = slices.find(x => x.id === d.id), st = d.store || {};
  const total = s.totalBytes || 0, free = s.freeBytes || 0, used = total - free;
  const stale = !isHost && (d.quiet_s || 0) > 10;
  const heat = s.temp_c ? Math.round(s.temp_c) + ' °C' : s.heat == null || s.heat < 0 ? '—' : s.heat < .5 ? 'cool' : s.heat < .8 ? 'warm' : 'hot';
  const heatCls = (s.temp_c > 85 || s.heat >= .8) ? 'bad' : (s.temp_c > 70 || s.heat >= .5) ? 'warn' : 'ok';
  const rttCls = (d.rtt_ms ?? 0) > 60 ? 'bad' : d.link === 'USB cable' ? 'ok' : 'warn';
  return `<div class="card dev ${stale ? 'stale' : ''}"><div class="h"><span>${isHost ? '💻' : '📱'}</span><span class="n">${esc(short(d.name))}</span>
      <span class="chip ${isHost ? 'ok' : 'helper'}">${isHost ? 'host' : 'helper'}</span></div>
    <div class="sub">${esc(chipName(s.chip))}${s.cores ? ' · ' + s.cores + ' cores' : ''}${s.maxGhz ? ' · ' + s.maxGhz.toFixed(1) + ' GHz' : ''}${stale ? ` · <span class="warn">quiet ${Math.round(d.quiet_s)} s</span>` : ''}</div>
    ${meter('Memory used', `${gb(used / 1e9)} / ${gb(total / 1e9)} GB`, pct(used, total), pct(used, total) > 90 ? 'var(--warn)' : 'var(--info)')}
    ${meter('Holding for the model', sl ? `layers ${sl.from}–${sl.to - 1} · ${gb(sl.gb)} GB` : 'nothing', sl ? pct(sl.gb * 1e9, total) : 0, isHost ? 'var(--ok)' : 'var(--helper)')}
    ${!isHost && st.total ? meter('Stored on the phone', `${st.done}/${st.total} · ${gb(st.bytes / 1e9)} GB${st.working ? ' · saving' : ''}`, pct(st.done, st.total), 'var(--ok)') : ''}
    <div class="kv">
      <span>Free for models</span><span>${gb(d.usable_gb)} GB</span>
      ${isHost ? '' : `<span>Link</span><span class="${rttCls}">${esc(d.link || '—')} · ${d.rtt_ms != null ? Math.round(d.rtt_ms) + ' ms' : '…'}${d.rtt_worst_ms != null ? ' (worst ' + Math.round(d.rtt_worst_ms) + ')' : ''}</span>`}
      <span>Heat</span><span class="${heatCls}">${heat}</span>
      <span>Battery</span><span>${s.battery >= 0 ? s.battery + '%' : '—'}${s.charging ? ' ⚡' : ''}</span>
      ${isHost ? `<span>Engine</span><span>${run.status === 'ready' ? 'llama-server' : esc(run.status || 'idle')}</span>` : `<span>Engine</span><span>${d.engine ? esc(d.engine) : 'idle'}</span><span>Address</span><span>${esc(d.addr || '')}</span>`}
    </div></div>`;
}
const meter = (k, v, p, color) => `<div class="meter"><div class="t"><span>${k}</span><span>${v}</span></div><div class="b"><i style="width:${p}%;background:${color}"></i></div></div>`;

function meshMap(m, slices) {
  const peers = m.peers || [], W = 520, H = 300, cx = W / 2, cy = H / 2 + 6, R = 108;
  const web = [0.35, 0.65, 1].map(f => `<polygon points="${[...Array(8)].map((_, i) => { const a = i / 8 * Math.PI * 2 - Math.PI / 2; return `${cx + Math.cos(a) * R * f * 1.15},${cy + Math.sin(a) * R * f}`; }).join(' ')}" fill="none" stroke="#1c1c20"/>`).join('') +
    [...Array(8)].map((_, i) => { const a = i / 8 * Math.PI * 2 - Math.PI / 2; return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * R * 1.15}" y2="${cy + Math.sin(a) * R}" stroke="#1c1c20"/>`; }).join('');
  const nodes = peers.map((p, i) => { const a = Math.PI + i / Math.max(peers.length, 1) * Math.PI * 2;   // first phone left, then around
    return { p, x: cx + Math.cos(a) * R * 1.55, y: cy + Math.sin(a) * R * 0.9 }; });
  const lines = nodes.map(({ p, x, y }) => { const c = (p.rtt_ms ?? 0) > 60 ? '#f87171' : p.link === 'USB cable' ? '#4ade80' : '#fbbf24';
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${c}" stroke-width="1.5" stroke-dasharray="${p.link === 'USB cable' ? '' : '4 4'}"/>
      <text x="${(cx + x) / 2}" y="${(cy + y) / 2 - 8}" fill="#8b8b93" font-size="11" font-family="monospace" text-anchor="middle">${p.rtt_ms != null ? Math.round(p.rtt_ms) + ' ms' : ''}${p.link === 'USB cable' ? ' · USB' : p.link ? ' · ' + esc(p.link) : ''}</text>`; }).join('');
  const lay = id => { const s = slices.find(x => x.id === id); return s ? `L${s.from}–${s.to - 1}` : ''; };
  const circles = nodes.map(({ p, x, y }) => `<circle cx="${x}" cy="${y}" r="24" fill="#111113" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="${x}" y="${y + 4}" fill="#a78bfa" font-size="11" font-family="monospace" text-anchor="middle">${esc(String(p.name).split('·').pop().trim())}</text>
      <text x="${x}" y="${y + 40}" fill="#8b8b93" font-size="11" font-family="monospace" text-anchor="middle">${lay(p.id)}</text>`).join('');
  return `<div class="sechead" style="padding:14px 16px 0;margin:0"><span class="label">Mesh</span></div><svg viewBox="0 0 ${W} ${H}">${web}${lines}
    <circle cx="${cx}" cy="${cy}" r="30" fill="#10231a" stroke="#4ade80" stroke-width="1.5"/>
    <text x="${cx}" y="${cy + 4}" fill="#4ade80" font-size="12" font-family="monospace" text-anchor="middle">host</text>
    <text x="${cx}" y="${cy + 46}" fill="#8b8b93" font-size="11" font-family="monospace" text-anchor="middle">${lay('laptop')}</text>${circles}</svg>`;
}

// ---------------------------------------------------------------- right: the model, then the agent
function renderSide() {
  const m = mesh || {}, run = m.run || {};
  const models = m.models || [];
  const sel = models.find(x => x.file === chosen.model);
  const loading = run.status === 'starting' || run.status === 'loading';
  const other = run.status === 'ready' && sel && run.model !== sel.name;
  const modelOpen = stepOk('Host') && stepOk('Phones');
  const agentOpen = stepOk('Run') && stepOk('Project');

  let h = `<div class="panel ${modelOpen ? '' : 'locked'}"><div class="sechead"><h2>Model</h2><span class="grow"></span>${sel && (m.pinned || {}).model === sel.file ? '<span class="chip ok">📌 pinned</span>' : ''}</div>
    ${models.map(x => { const v = x.plan?.verdict, c = v === 'doable' ? 'ok' : v === 'tight' ? 'warn' : 'bad';
      return `<div class="opt ${x.file === chosen.model ? 'sel' : ''}" onclick="pickModel('${esc(x.file)}')"><span class="dot ${c}"></span><div class="t">${esc(x.name)}<small>${gb(x.gb)} GB · ${esc(x.plan?.reason || '')}</small></div><span class="chip ${c}">${v === 'doable' ? 'Doable' : v === 'tight' ? 'Tight' : 'No'}</span></div>`; }).join('')}
    <div class="runline"><span class="dot ${run.status === 'ready' ? 'ok' : loading ? 'live' : run.status === 'failed' ? 'bad' : ''}"></span>
      <div class="t">${esc(run.model || 'Nothing running')}<small>${esc(run.status || 'idle')}${run.step ? ' · ' + esc(run.step) : ''}${loading && run.seconds ? ' · ' + run.seconds + ' s' : ''}</small></div>
      ${loading || run.status === 'ready' ? '<button class="btn" onclick="svc(\'/svc/stop\',{}).then(poll)">Stop</button>' : ''}
      ${loading ? '' : `<button class="btn primary" ${sel && sel.plan?.verdict !== 'not_possible' ? '' : 'disabled'} onclick="runModel()">${other ? 'Switch' : run.status === 'ready' ? 'Restart' : 'Run'}</button>`}</div>
    ${loading ? '<div class="progress" style="margin-top:10px"><i></i></div>' : ''}
    ${sel ? `<div style="margin-top:10px"><button class="btn ghost" onclick="togglePin()">${(m.pinned || {}).model === sel.file ? 'Unpin split' : 'Pin this split'}</button></div>` : ''}</div>`;

  const proj = projects.find(p => p.path === chosen.project);
  h += `<div class="panel ${stepOk('Run') ? '' : 'locked'}"><div class="sechead"><h2>Agent</h2><span class="grow"></span><span class="chip">Aider</span></div>
    ${projects.map(p => `<div class="opt ${p.path === chosen.project ? 'sel' : ''}" onclick="pickProject('${esc(p.path)}')"><span class="dot ${p.path === chosen.project ? 'ok' : ''}"></span><div class="t">${esc(p.name)}<small>${esc(p.path)}</small></div></div>`).join('')}
    <button class="btn ghost" onclick="chooseFolder()">Choose project…</button>
    <div style="margin-top:16px" class="label">Permissions</div>
    <div style="margin-top:6px">${PERMS.map(([k, name, what]) => `<div class="perm"><div class="t">${name}<small class="${k === 'shell' && perms.shell ? 'bad' : ''}">${what}</small></div>
      <button class="sw ${perms[k] ? 'on' : ''} ${k === 'shell' ? 'danger' : ''}" onclick="togglePerm('${k}')" title="${name}"></button></div>`).join('')}</div>
    <div class="field ${perms.tests ? '' : 'locked'}"><span class="label">Tests</span><input id="testcmd" spellcheck="false" value="${esc(load('test:' + chosen.project, '') || proj?.test_cmd || 'python3 -m pytest -q')}" onchange="store('test:'+chosen.project,this.value)"></div>
    <div class="${agentOpen ? '' : 'locked'}"><textarea class="ask" id="ask" placeholder="What should it change? (Ctrl+Enter)">${esc($('ask')?.value || '')}</textarea>
    <div class="sendrow"><span class="grow">${esc(note)}</span>${current?.status === 'running' ? '<button class="btn" onclick="stopTask()">Stop</button>' : ''}
      <button class="btn primary" onclick="send()" ${busy || tasks.some(t => t.status === 'running') ? 'disabled' : ''}>Send</button></div>
    ${taskCard()}
    ${recent()}</div></div>`;
  h += `<div class="panel"><div class="label" style="margin-bottom:8px">Agent rules</div><div class="rules">${rule('TESTS','Your test command decides pass or fail')}${rule('UNDO','Undo is a git revert, history stays')}${rule('ONE','One task at a time')}${rule('CTX','Needs a 16k context')}</div></div>`;
  const focus = document.activeElement?.id, caret = focus === 'ask' ? $('ask').selectionStart : null;
  $('side').innerHTML = h;
  if (focus === 'ask') { $('ask').focus(); $('ask').setSelectionRange(caret, caret); }
  $('ask')?.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
}

function taskCard() {
  const t = current; if (!t) return '';
  const text = events.filter(e => e.t === 'text').map(e => e.text).join('');
  const commits = events.filter(e => e.t === 'commit'), edits = [...new Set(events.filter(e => e.t === 'edit').map(e => e.file))];
  const tests = events.find(e => e.t === 'tests'), done = events.find(e => e.t === 'done'), err = events.find(e => e.t === 'error');
  const running = t.status === 'running';
  return `<div class="task"><div class="ttl">${running ? '<span class="dot live"></span> ' : ''}${esc(t.title)}</div>
    <div class="line">${running ? `working · ${dur(Date.now() / 1000 - t.started)}` : `<span class="${t.status === 'done' ? 'ok' : 'bad'}">${esc(t.status)}</span> · ${dur(done?.seconds)}${done?.tps ? ' · ' + done.tps.toFixed(1) + ' tok/s' : ''}`}</div>
    ${edits.length ? `<div class="line">edited ${edits.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div>` : ''}
    ${commits.map(c => `<div class="line">commit <b class="mono" style="color:var(--fg)">${c.hash}</b><button class="btn ghost" style="padding:1px 8px" onclick="showDiff('${c.hash}')">Diff</button>${(t.undone || []).includes(c.hash) ? '<span class="chip">reverted</span>' : `<button class="btn ghost" style="padding:1px 8px" onclick="undo('${c.hash}')">Undo</button>`}</div>`).join('')}
    ${tests ? `<div class="line"><span class="${tests.ok ? 'ok' : 'bad'}">${tests.ok ? '✓' : '✗'} tests: ${esc(tests.summary)}</span></div>` : ''}
    ${err ? `<div class="line bad">${esc(err.text)}</div>` : ''}
    <details ${running ? 'open' : ''}><summary>output · ${text.split('\n').length} lines</summary><pre id="livepre">${esc(text.split('\n').slice(-40).join('\n'))}</pre></details></div>`;
}
function recent() {
  const list = tasks.filter(t => t.project === chosen.project).slice(0, 6);
  if (!list.length) return '';
  return `<div class="recent" style="margin-top:14px"><div class="label" style="margin-bottom:4px">Recent</div>${list.map(t => `<button onclick="openTask('${t.id}')"><span class="dot ${t.status === 'running' ? 'live' : t.tests?.ok ? 'ok' : t.status === 'done' ? 'warn' : 'bad'}"></span><span class="t">${esc(t.title)}</span></button>`).join('')}</div>`;
}

function render() {
  try { renderCluster(); renderSide(); const pre = $('livepre'); if (pre) pre.scrollTop = pre.scrollHeight; }
  catch (e) { console.error(e); }
}

// ---------------------------------------------------------------- actions
function pickModel(file) { chosen.model = file; store('model', file); render(); }
function pickProject(path) { chosen.project = path; store('project', path); current = null; render(); }
function togglePerm(k) { perms[k] = !perms[k]; store('perms', JSON.stringify(perms)); render(); }
async function runModel() { try { await svc('/svc/run', { model: chosen.model }); } catch (e) { note = 'Run: ' + e.message; } poll(); }
async function togglePin() { const pinned = (mesh.pinned || {}).model === chosen.model;
  try { const r = await svc(pinned ? '/svc/unpin' : '/svc/pin', { model: chosen.model }); if (r.ok === false) note = 'Pin: ' + r.error; } catch (e) { note = e.message; } poll(); }
function chooseFolder() { if (!native({ kind: 'pick' })) { const p = prompt('Path of a git repository'); if (p) window.onPicked(p); } }
window.onPicked = async path => { try { projects = await svc('/svc/projects', { path }); pickProject(projects[0].path); } catch (e) { note = e.message; render(); } };
async function openTask(id) { const d = await svc(`/svc/tasks/${id}`); current = d.meta; events = d.events; nextEv = d.next; render(); }
async function send() {
  const ask = $('ask'), prompt = ask?.value.trim(); if (!prompt || busy) return;
  busy = true; note = ''; render();
  try { const r = await svc('/svc/tasks', { project: chosen.project, prompt, test_cmd: $('testcmd')?.value.trim(), perms });
        $('ask').value = ''; tasks = await svc('/svc/tasks'); await openTask(r.id); }
  catch (e) { note = e.message; }
  busy = false; render();
}
async function stopTask() { if (current) await svc(`/svc/tasks/${current.id}/stop`, {}).catch(() => {}); }
async function undo(hash) { if (!confirm('Revert ' + hash + '? A new commit undoes it.')) return;
  try { await svc(`/svc/tasks/${current.id}/undo`, { commit: hash }); await openTask(current.id); } catch (e) { note = 'Undo: ' + e.message; render(); } }
async function showDiff(hash) {
  $('mtitle').textContent = hash; $('mdiff').innerHTML = 'loading…'; $('modal').classList.add('on');
  let d = ''; try { d = (await svc(`/svc/diff?project=${encodeURIComponent(current.project)}&commit=${hash}`)).diff; } catch (e) { d = e.message; }
  $('mdiff').innerHTML = d.split('\n').map(l => `<div class="${l.startsWith('+') && !l.startsWith('+++') ? 'a' : l.startsWith('-') && !l.startsWith('---') ? 'd' : l.startsWith('@@') ? 'x' : ''}">${esc(l) || ' '}</div>`).join('');
}
function closeDiff() { $('modal').classList.remove('on'); }

// ---------------------------------------------------------------- polling
async function poll() {
  try {
    const [m, ps, ts] = await Promise.all([svc('/svc/mesh'), svc('/svc/projects'), svc('/svc/tasks')]);
    mesh = m; projects = ps; tasks = ts;
    if (!chosen.model && m.run?.status === 'ready') { const f = (m.models || []).find(x => x.name === m.run.model); if (f) { chosen.model = f.file; store('model', f.file); } }
    if (!chosen.project && projects.length === 1) { chosen.project = projects[0].path; store('project', chosen.project); }
    if (!current) { const t = tasks.find(t => t.project === chosen.project); if (t) await openTask(t.id); }
    $('banner').classList.remove('on');
  } catch (e) { $('banner').classList.add('on'); }
  if (document.activeElement?.tagName !== 'INPUT') render();
}
async function pollTask() {
  if (current && current.status === 'running') {
    try { const d = await svc(`/svc/tasks/${current.id}?after=${nextEv}`); current = d.meta; events = events.concat(d.events); nextEv = d.next;
          if (d.events.length && document.activeElement?.tagName !== 'INPUT') render(); } catch (e) {}
  }
}
poll(); setInterval(poll, 2000); setInterval(pollTask, 700);
</script>
</body>
</html>
